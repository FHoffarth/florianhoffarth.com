name: Deploy personal site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare allowlisted publication directory
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/personal-site/assets"
          cp index.html impressum.html datenschutz.html styles.css "$RUNNER_TEMP/personal-site/"
          cp assets/portrait.png "$RUNNER_TEMP/personal-site/assets/portrait.png"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/personal-site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
